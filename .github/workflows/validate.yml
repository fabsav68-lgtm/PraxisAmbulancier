name: Vérification syntaxe JS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vérifier la syntaxe de tous les fichiers JS et blocs <script>
        run: python3 .github/scripts/check-syntax.py
