<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PraxisAmbulancier · Dashboard Avis Formateur</title>
<style>
:root{--bg:#0d0f0a;--card:rgba(255,255,255,.04);--bdr:rgba(255,255,255,.09);--txt:#eef2ec;--txt2:#7a8a72;--em:#0ea5e9;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,'Karla',sans-serif;min-height:100vh;padding:20px 16px 60px}
.wrap{max-width:680px;margin:0 auto}
h1{font-size:20px;font-weight:800;margin-bottom:4px;color:var(--em)}
.sub{color:var(--txt2);font-size:12px;margin-bottom:20px}
/* Login */
.login-card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:28px;max-width:320px;margin:80px auto;text-align:center}
.login-card h2{font-size:18px;font-weight:800;color:var(--em);margin-bottom:16px}
.login-input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--bdr);background:rgba(255,255,255,.05);color:var(--txt);font-size:14px;margin-bottom:10px;text-align:center;letter-spacing:2px}
.login-btn{width:100%;padding:11px;border-radius:8px;background:linear-gradient(135deg,#0c4a6e,var(--em));border:none;color:#0d0f0a;font-weight:800;font-size:14px;cursor:pointer}
/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:12px;text-align:center}
.stat-v{font-size:22px;font-weight:800;color:var(--em);display:block}
.stat-l{font-size:10px;color:var(--txt2);margin-top:2px}
/* Filtres */
.filters{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{flex-shrink:0;background:rgba(255,255,255,.04);border:1px solid var(--bdr);color:var(--txt2);padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.filter.active{background:rgba(14,165,233,.15);border-color:rgba(14,165,233,.4);color:var(--em)}
/* Avis card */
.avis-card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:14px;margin-bottom:10px}
.avis-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.avis-stars{color:var(--amber);font-size:16px}
.avis-meta{font-size:10px;color:var(--txt2);font-family:monospace}
.avis-module{font-size:13px;font-weight:700;color:var(--em);margin-bottom:4px}
.avis-badges{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid var(--bdr);color:var(--txt2)}
.avis-comment{font-size:12.5px;color:var(--txt2);font-style:italic;padding:8px 10px;background:rgba(0,0,0,.2);border-radius:8px;margin:6px 0}
.reponse-wrap{margin-top:8px}
.reponse-existing{background:rgba(14,165,233,.08);border:1px solid rgba(14,165,233,.2);border-radius:8px;padding:8px;font-size:12px;color:#7dd3fc;margin-bottom:6px}
.reponse-input{width:100%;padding:8px;border-radius:8px;border:1px solid var(--bdr);background:rgba(255,255,255,.04);color:var(--txt);font-size:12px;resize:none;height:52px;font-family:inherit;margin-bottom:6px}
.reponse-btn{padding:7px 14px;border-radius:8px;background:linear-gradient(135deg,#0c4a6e,var(--em));border:none;color:#0d0f0a;font-size:12px;font-weight:700;cursor:pointer}
.lu-badge{font-size:9px;padding:2px 6px;border-radius:6px;background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.empty{text-align:center;padding:40px;color:var(--txt2);font-size:13px}
.loading{text-align:center;padding:30px;color:var(--txt2);font-size:13px}
</style>
</head>
<body>
<div class="wrap" id="login-wrap">
  <div class="login-card">
    <h2>🚑 PraxisAmbulancier<br>Dashboard Formateur</h2>
    <input type="password" class="login-input" id="pwd-input" placeholder="Mot de passe" onkeydown="if(event.key==='Enter') login()"/>
    <button class="login-btn" onclick="login()">Accéder →</button>
    <div id="login-err" style="color:#ef4444;font-size:11px;margin-top:8px;display:none">Mot de passe incorrect</div>
  </div>
</div>

<div class="wrap" id="dashboard-wrap" style="display:none">
  <h1>🚑 PraxisAmbulancier — Avis formateur</h1>
  <div class="sub" id="dash-sub">Chargement...</div>
  <div class="stats" id="stats-zone"></div>
  <div class="filters" id="filters-zone"></div>
  <div id="avis-liste"></div>
</div>

<script>
var SUPABASE_URL  = 'https://fvrfiikrasezlzpaxpqz.supabase.co';
var SUPABASE_ANON = 'sb_publishable_TNksbociGaWCY53M4wCAXg_faOxEqKt';
var PWD = 'PraxisAmbu2026';
var MODULES = ['PraxisBilan','PraxisGestes','PraxisInstallation','PraxisRégulation','PraxisRéalités','PraxisVéhicule'];

var AVIS = [], FILTRE = 'tous';

function login(){
  var v = document.getElementById('pwd-input').value;
  if(v === PWD || v === 'MEDEXPERT-ADMIN'){
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('dashboard-wrap').style.display = 'block';
    charger();
  } else {
    document.getElementById('login-err').style.display = 'block';
  }
}

async function charger(){
  document.getElementById('avis-liste').innerHTML = '<div class="loading">Chargement...</div>';
  try {
    var r = await fetch(SUPABASE_URL + '/rest/v1/avis?app=eq.PraxisAmbulancier&select=*&order=id.desc', {
      headers: { apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON }
    });
    AVIS = await r.json();
    render();
  } catch(e) {
    document.getElementById('avis-liste').innerHTML = '<div class="empty">⚠️ Erreur de chargement</div>';
  }
}

function render(){
  var now = new Date().toLocaleString('fr-FR');
  document.getElementById('dash-sub').textContent = 'Dernière mise à jour : ' + now;

  // Filtres
  var mods = ['tous', ...MODULES];
  document.getElementById('filters-zone').innerHTML = mods.map(function(m){
    return '<button class="filter '+(FILTRE===m?'active':'')+'" onclick="setFiltre(\''+m+'\')">'+
      (m==='tous'?'Tous les modules':m)+'</button>';
  }).join('');

  var visibles = FILTRE==='tous' ? AVIS : AVIS.filter(function(a){ return a.module && a.module.indexOf(FILTRE)!==-1; });
  var nonLus   = AVIS.filter(function(a){ return !a.lu; }).length;
  var moy      = AVIS.length ? (AVIS.reduce(function(s,a){ return s+(a.note||0); },0)/AVIS.length).toFixed(1) : '—';

  // Stats
  document.getElementById('stats-zone').innerHTML =
    '<div class="stat"><span class="stat-v">'+AVIS.length+'</span><span class="stat-l">Avis total</span></div>'+
    '<div class="stat"><span class="stat-v">'+nonLus+'</span><span class="stat-l">Non lus</span></div>'+
    '<div class="stat"><span class="stat-v">'+moy+' ★</span><span class="stat-l">Note moyenne</span></div>';

  if(!visibles.length){
    document.getElementById('avis-liste').innerHTML = '<div class="empty">Aucun avis pour ce module.</div>';
    return;
  }

  document.getElementById('avis-liste').innerHTML = visibles.map(function(a){
    var stars = '';
    for(var i=1;i<=5;i++) stars += i<=(a.note||0) ? '★' : '☆';
    var d = new Date(a.created_at).toLocaleString('fr-FR');
    return '<div class="avis-card" id="avis-'+a.id+'">'+
      '<div class="avis-top">'+
        '<div>'+
          '<div class="avis-module">'+esc(a.module||'—')+'</div>'+
          '<div class="avis-stars">'+stars+'</div>'+
        '</div>'+
        '<div style="text-align:right">'+
          '<div class="avis-meta">'+esc(a.code||'')+'</div>'+
          '<div class="avis-meta">'+d+'</div>'+
          (a.lu ? '<span class="lu-badge">✓ Lu</span>' : '')+
        '</div>'+
      '</div>'+
      '<div class="avis-badges">'+
        (a.aide ? '<span class="badge">Aide : '+esc(a.aide)+'</span>' : '')+
        (a.difficulte ? '<span class="badge">Difficulté : '+esc(a.difficulte)+'</span>' : '')+
        (a.promo ? '<span class="badge">'+esc(a.promo)+'</span>' : '')+
      '</div>'+
      (a.commentaire ? '<div class="avis-comment">'+esc(a.commentaire)+'</div>' : '')+
      '<div class="reponse-wrap">'+
        (a.reponse ? '<div class="reponse-existing">💬 '+esc(a.reponse)+'</div>' : '')+
        '<textarea class="reponse-input" id="rep-'+a.id+'" placeholder="Répondre à cet avis...">'+esc(a.reponse||'')+'</textarea>'+
        '<button class="reponse-btn" onclick="repondre(\''+a.id+'\')">Envoyer la réponse</button>'+
        '<button onclick="marquerLu(\''+a.id+'\')" style="margin-left:8px;padding:7px 12px;border-radius:8px;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);color:var(--green);font-size:12px;cursor:pointer">✓ Marquer lu</button>'+
      '</div>'+
    '</div>';
  }).join('');
}

function setFiltre(m){ FILTRE = m; render(); }
function esc(s){ return (s||'').toString().replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

async function repondre(id){
  var rep = document.getElementById('rep-'+id).value.trim();
  if(!rep) return;
  await fetch(SUPABASE_URL + '/rest/v1/avis?id=eq.'+id, {
    method: 'PATCH',
    headers: { apikey: SUPABASE_ANON, Authorization: 'Bearer '+SUPABASE_ANON, 'Content-Type':'application/json', Prefer:'return=minimal' },
    body: JSON.stringify({ reponse: rep, lu: true })
  });
  var a = AVIS.find(function(x){ return x.id==id; });
  if(a){ a.reponse = rep; a.lu = true; }
  render();
}

async function marquerLu(id){
  await fetch(SUPABASE_URL + '/rest/v1/avis?id=eq.'+id, {
    method: 'PATCH',
    headers: { apikey: SUPABASE_ANON, Authorization: 'Bearer '+SUPABASE_ANON, 'Content-Type':'application/json', Prefer:'return=minimal' },
    body: JSON.stringify({ lu: true })
  });
  var a = AVIS.find(function(x){ return x.id==id; });
  if(a) a.lu = true;
  render();
}
</script>
</body>
</html>
